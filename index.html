<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Expedition Cruise Atlas — Where Each Operator Sails</title>
<link rel="preconnect" href="https://server.arcgisonline.com" crossorigin>
<link rel="preconnect" href="https://images.squarespace-cdn.com" crossorigin>
<link rel="stylesheet" href="vendor/leaflet.min.css">
<style>
  :root{
    --bg:#06121f; --panel:#0d1f30; --panel2:#12283c; --line:#24445e;
    --ink:#eaf3fb; --muted:#9fb6cb; --accent:#46c2ff; --accent2:#ffd166;
    --shadow:0 10px 40px rgba(0,0,0,.45);
    --sans:'Segoe UI',Roboto,-apple-system,system-ui,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{font-family:var(--sans);background:var(--bg);color:var(--ink);overflow:hidden}
  #map{position:absolute;inset:0;background:#06121f;z-index:1}


  /* ---------- Title bar ---------- */
  .topbar{
    position:absolute;top:0;left:0;right:0;z-index:1000;
    display:flex;align-items:center;gap:14px;padding:12px 18px;
    background:linear-gradient(180deg,rgba(4,12,20,.92),rgba(4,12,20,.55) 70%,transparent);
    pointer-events:none;
  }
  .topbar .brand{pointer-events:auto;display:flex;align-items:center;gap:13px}
  .topbar h1{font-size:18px;margin:0;letter-spacing:.3px;font-weight:700}
  .topbar h1 span{color:var(--accent)}
  .topbar p{margin:1px 0 0;font-size:12px;color:var(--muted)}
  .logochip{background:#fff;border-radius:11px;flex:0 0 auto;display:flex;align-items:center;
    justify-content:center;box-shadow:0 4px 14px rgba(0,0,0,.4),0 0 0 1px rgba(255,255,255,.25)}
  .logochip img{display:block;object-fit:contain}
  .logochip.ebl{height:48px;padding:6px 10px}
  .logochip.ebl img{height:36px;max-width:160px}
  .logochip.ata{height:40px;padding:5px 9px}
  .logochip.ata img{height:30px;max-width:120px}
  .partner{pointer-events:auto;margin-left:auto;display:flex;align-items:center;gap:9px;
    text-decoration:none;color:var(--muted);transition:.15s}
  .partner:hover{color:var(--ink)}
  .partner span{font-size:11px;letter-spacing:.6px;text-transform:uppercase;font-weight:600;white-space:nowrap}

  /* ---------- Operator filter rail ---------- */
  .rail{
    position:absolute;z-index:1000;top:74px;left:14px;width:228px;
    background:rgba(13,31,48,.92);border:1px solid var(--line);border-radius:14px;
    box-shadow:var(--shadow);backdrop-filter:blur(8px);overflow:hidden;
    display:flex;flex-direction:column;max-height:calc(100% - 96px)}
  .rail h2{font-size:11px;text-transform:uppercase;letter-spacing:1.3px;color:var(--muted);
    margin:0;padding:13px 14px 9px}
  .rail .ops{overflow-y:auto;padding:0 8px 8px}
  .op{
    display:flex;align-items:center;gap:9px;padding:7px 8px;border-radius:10px;cursor:pointer;
    border:1px solid transparent;transition:.15s;margin-bottom:2px}
  .op:hover{background:var(--panel2)}
  .op.active{background:var(--panel2);border-color:var(--accent)}
  .op .lg{width:30px;height:30px;border-radius:7px;background:#fff;flex:0 0 auto;
    display:flex;align-items:center;justify-content:center;overflow:hidden;font-weight:800;font-size:12px}
  .op .lg img{max-width:100%;max-height:100%;object-fit:contain;display:block}
  .op .nm{font-size:12.5px;line-height:1.15;font-weight:600}
  .op .ct{font-size:10.5px;color:var(--muted);margin-top:1px}
  .op .dot{width:8px;height:8px;border-radius:50%;margin-left:auto;flex:0 0 auto;opacity:.9}
  .rail .reset{margin:6px 10px 12px;text-align:center;font-size:11.5px;color:var(--accent);
    cursor:pointer;padding:7px;border:1px dashed var(--line);border-radius:9px;display:none}
  .rail .reset.show{display:block}

  /* ---------- Detail panel (region) ---------- */
  .panel{
    position:absolute;z-index:1001;top:0;right:0;height:100%;width:380px;max-width:92vw;
    background:linear-gradient(180deg,var(--panel),#091823);border-left:1px solid var(--line);
    box-shadow:-12px 0 40px rgba(0,0,0,.5);transform:translateX(105%);
    transition:transform .32s cubic-bezier(.22,.61,.36,1);display:flex;flex-direction:column}
  .panel.open{transform:none}
  .panel .hero{position:relative;padding:22px 22px 16px;border-bottom:1px solid var(--line);
    background:radial-gradient(120% 120% at 80% 0%,rgba(70,194,255,.18),transparent 60%)}
  .panel .close{position:absolute;top:14px;right:14px;width:30px;height:30px;border-radius:8px;
    border:1px solid var(--line);background:var(--panel2);color:var(--ink);cursor:pointer;font-size:15px}
  .panel .klabel{font-size:11px;letter-spacing:1.4px;text-transform:uppercase;color:var(--accent)}
  .panel h3{margin:6px 0 4px;font-size:23px;line-height:1.15}
  .panel .sub{font-size:12.5px;color:var(--muted)}
  .panel .list{overflow-y:auto;padding:14px 16px 26px;flex:1}
  .card{display:flex;align-items:center;gap:13px;padding:12px;border:1px solid var(--line);
    border-radius:13px;background:var(--panel2);margin-bottom:10px;text-decoration:none;color:var(--ink);
    transition:.16s;position:relative}
  .card:hover{border-color:var(--accent);transform:translateY(-1px);background:#173249}
  .card .lg{width:50px;height:50px;border-radius:10px;background:#fff;flex:0 0 auto;
    display:flex;align-items:center;justify-content:center;overflow:hidden;font-weight:800}
  .card .lg img{max-width:100%;max-height:100%;object-fit:contain}
  .card .meta{min-width:0}
  .card .meta .nm{font-size:15px;font-weight:700;line-height:1.15}
  .card .meta .go{font-size:12px;color:var(--accent);margin-top:3px;display:flex;align-items:center;gap:5px}
  .card .arrow{margin-left:auto;color:var(--muted);font-size:18px;flex:0 0 auto}

  /* ---------- Markers ---------- */
  .rmarker{position:relative;transform:translate(-50%,-50%);cursor:pointer}
  .rmarker .ring{width:var(--sz,34px);height:var(--sz,34px);border-radius:50%;
    background:radial-gradient(circle at 35% 30%,rgba(120,220,255,.95),rgba(40,140,210,.85) 60%,rgba(10,50,80,.9));
    border:2px solid rgba(255,255,255,.85);box-shadow:0 0 0 4px rgba(70,194,255,.22),0 5px 16px rgba(0,0,0,.5);
    display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;color:#fff;
    transition:.18s}
  .rmarker:hover .ring{transform:scale(1.12);box-shadow:0 0 0 6px rgba(70,194,255,.3),0 6px 18px rgba(0,0,0,.6)}
  .rmarker.dim .ring{opacity:.22;filter:grayscale(.5)}
  .rmarker.hit .ring{background:radial-gradient(circle at 35% 30%,#ffe79a,#ffce5a 55%,#e09b1f);
    border-color:#fff;box-shadow:0 0 0 5px rgba(255,209,102,.35),0 6px 18px rgba(0,0,0,.55)}
  .rmarker .tag{position:absolute;left:50%;top:calc(var(--sz,34px) + 8px);transform:translateX(-50%);
    white-space:nowrap;background:rgba(6,18,31,.9);border:1px solid var(--line);color:var(--ink);
    font-size:11px;font-weight:600;padding:3px 8px;border-radius:7px;pointer-events:none;opacity:0;
    transition:.15s;letter-spacing:.2px}
  .rmarker:hover .tag{opacity:1}

  /* ---------- Help / hint ---------- */
  .hint{position:absolute;z-index:1000;bottom:16px;left:50%;transform:translateX(-50%);
    background:rgba(13,31,48,.9);border:1px solid var(--line);border-radius:30px;padding:8px 18px;
    font-size:12.5px;color:var(--muted);box-shadow:var(--shadow);backdrop-filter:blur(6px)}
  .hint b{color:var(--ink)}
  .leaflet-popup,.leaflet-control-attribution{font-family:var(--sans)}
  .leaflet-bar a{background:var(--panel2);color:var(--ink);border-bottom-color:var(--line)}
  .leaflet-bar a:hover{background:#173249}

  @media (max-width:640px){
    .rail{display:none}
    .panel{width:100%}
    .topbar p{display:none}
    .partner span{display:none}
    .logochip.ebl{height:42px}.logochip.ebl img{height:30px;max-width:120px}
    .hint{display:none}
  }
</style>
</head>
<body>
<div id="map"></div>

<div class="topbar">
  <div class="brand">
    <div class="logochip ebl">
      <img src="https://images.squarespace-cdn.com/content/v1/57d86bcd46c3c49c625850a1/54c90494-d588-412d-9643-5d5650d856fd/ebl+2026+Gemini.png?format=750w" alt="Expedition Bucket List">
    </div>
    <div>
      <h1>Expedition Cruise <span>Atlas</span></h1>
      <p>Explore the world's expedition operators &middot; tap a region to see who sails there</p>
    </div>
  </div>
  <a class="partner" href="https://www.expeditionbucketlist.com" target="_blank" rel="noopener">
    <span>Presented&nbsp;by</span>
    <div class="logochip ata">
      <img src="https://images.squarespace-cdn.com/content/v1/57d86bcd46c3c49c625850a1/8c7b524b-9951-4a51-aaf2-44982357ccfe/ATA+logo+clear+2025+black.png?format=750w" alt="Aspen Travel Advisors">
    </div>
  </a>
</div>

<aside class="rail">
  <h2>Filter by operator</h2>
  <div class="ops" id="opList"></div>
  <div class="reset" id="reset">✕ Clear operator filter</div>
</aside>

<section class="panel" id="panel">
  <div class="hero">
    <button class="close" id="close">✕</button>
    <div class="klabel">Expedition region</div>
    <h3 id="pTitle">Region</h3>
    <div class="sub" id="pSub"></div>
  </div>
  <div class="list" id="pList"></div>
</section>

<div class="hint">🌍 Drag to explore &middot; scroll to zoom &middot; click a <b>glowing pin</b> for operators</div>

<script src="vendor/leaflet.min.js"></script>
<script>
  // ── DATA LOADING ─────────────────────────────────────────────────────────
  let OPERATORS, COORDS, REGIONS;

  /* Init the map + satellite imagery IMMEDIATELY. Previously the whole map was
     created inside _dataReady.then(), so nothing rendered until itinerary.json
     (~210KB) finished downloading — any slowness looked like a broken/blank map.
     Now the base imagery paints right away and markers are added when data lands. */
  const map=L.map('map',{worldCopyJump:true,minZoom:2,maxZoom:8,zoomControl:false})
    .setView([22,-20],2.4);
  L.control.zoom({position:'bottomleft'}).addTo(map);
  L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{
    attribution:'Imagery © Esri, Maxar, Earthstar Geographics &middot; Expedition data: Brian Harris / Virtuoso',
    maxZoom:8
  }).addTo(map);

  /* WebKit (Safari + iOS, incl. iOS Chrome) lays out lazily: when the map is
     created synchronously at script start the #map container can still report
     0 height, so Leaflet computes bad tile bounds and the map appears frozen.
     Recalculate the size once layout settles and whenever the viewport changes. */
  function _fixMapSize(){ map.invalidateSize(false); }
  requestAnimationFrame(_fixMapSize);
  window.addEventListener('load', _fixMapSize);
  window.addEventListener('resize', _fixMapSize);
  window.addEventListener('orientationchange', _fixMapSize);
  setTimeout(_fixMapSize, 300);

  const _dataReady = fetch('itinerary.json')
    .then(r => { if(!r.ok) throw new Error('itinerary.json HTTP '+r.status); return r.json(); })
    .then(d => { OPERATORS = d.OPERATORS; COORDS = d.COORDS; REGIONS = d.REGIONS; })
    .catch(err => { console.error('Expedition Atlas: itinerary data failed to load —', err); });

/* ===== Operator display metadata ===== */
;

/* ===== Region coordinates (marker placement) ===== */
;

/* ===== Region → operators (deep-linked) — injected from spreadsheet ===== */
;

/* ===== logo helper with multi-source fallback chain =====
   Google favicons → DuckDuckGo → brand-coloured initials.       */
function logoEl(opName, big){
  const m = OPERATORS[opName] || {short:opName,domain:"",color:"#26506e"};
  const wrap = document.createElement('div');
  wrap.className='lg';
  function initials(){
    wrap.innerHTML='';
    wrap.style.background=m.color; wrap.style.color='#fff';
    wrap.textContent=(m.short.match(/[A-Za-z]/g)||['?']).slice(0,2).join('').toUpperCase();
  }
  if(!m.domain){ initials(); return wrap; }
  const sources=[
    'logos/'+m.domain+'.png',
    'https://www.google.com/s2/favicons?sz=128&domain='+m.domain,
    'https://icons.duckduckgo.com/ip3/'+m.domain+'.ico'
  ];
  const img=document.createElement('img');
  img.loading='lazy'; img.alt=m.short; let i=0;
  img.onerror=function(){ if(i<sources.length){ img.src=sources[i++]; } else { initials(); } };
  img.onload=function(){ if(img.naturalWidth<8){ img.onerror(); } };
  img.src=sources[i++];
  wrap.appendChild(img);
  return wrap;
}

/* ===== Map ===== */
_dataReady.then(() => {
if(!REGIONS){ return; }   // data failed to load — base imagery still renders

/* ===== Build markers ===== */
const markers={}; // region -> {marker, el}
let activeOp=null, activeRegion=null;

Object.keys(REGIONS).forEach(region=>{
  const c=COORDS[region]; if(!c) return;
  const ops=REGIONS[region];
  const sz=Math.max(30,Math.min(52, 26+ops.length*2.4));
  const el=document.createElement('div');
  el.className='rmarker';
  el.style.setProperty('--sz',sz+'px');
  el.innerHTML=`<div class="ring">${ops.length}</div><div class="tag">${region} &middot; ${ops.length} operators</div>`;
  el.addEventListener('click',e=>{e.stopPropagation();openRegion(region);});
  const icon=L.divIcon({className:'',html:el,iconSize:[0,0]});
  const mk=L.marker(c,{icon,riseOnHover:true}).addTo(map);
  markers[region]={marker:mk,el,ops};
});

/* ===== Operator filter rail ===== */
const opList=document.getElementById('opList');
const opCounts={};
Object.values(REGIONS).forEach(arr=>arr.forEach(o=>opCounts[o.company]=(opCounts[o.company]||0)+1));
Object.keys(OPERATORS).forEach(name=>{
  const m=OPERATORS[name];
  const row=document.createElement('div');
  row.className='op';
  const lg=logoEl(name);
  const txt=document.createElement('div');
  txt.innerHTML=`<div class="nm">${m.short}</div><div class="ct">${opCounts[name]||0} regions</div>`;
  const dot=document.createElement('div');dot.className='dot';dot.style.background=m.color;
  row.appendChild(lg);row.appendChild(txt);row.appendChild(dot);
  row.addEventListener('click',()=>toggleOp(name,row));
  opList.appendChild(row);
});

function toggleOp(name,row){
  const wasActive = activeOp===name;
  document.querySelectorAll('.op').forEach(r=>r.classList.remove('active'));
  if(wasActive){ activeOp=null; }
  else { activeOp=name; row.classList.add('active'); }
  applyFilter();
  document.getElementById('reset').classList.toggle('show', !!activeOp);
}
function applyFilter(){
  Object.entries(markers).forEach(([region,obj])=>{
    const hit = activeOp ? obj.ops.some(o=>o.company===activeOp) : true;
    obj.el.classList.toggle('dim', activeOp && !hit);
    obj.el.classList.toggle('hit', activeOp && hit);
  });
}
document.getElementById('reset').addEventListener('click',()=>{
  activeOp=null;document.querySelectorAll('.op').forEach(r=>r.classList.remove('active'));
  applyFilter();document.getElementById('reset').classList.remove('show');
});

/* ===== Region detail panel ===== */
const panel=document.getElementById('panel');
function openRegion(region){
  activeRegion=region;
  let ops=REGIONS[region].slice();
  // sort: filtered operator first, then alpha
  ops.sort((a,b)=>{
    if(activeOp){ if(a.company===activeOp)return -1; if(b.company===activeOp)return 1; }
    return (OPERATORS[a.company]?.short||a.company).localeCompare(OPERATORS[b.company]?.short||b.company);
  });
  document.getElementById('pTitle').textContent=region;
  document.getElementById('pSub').textContent=ops.length+' expedition operator'+(ops.length>1?'s':'')+' sail here · tap a card to view live cruises';
  const list=document.getElementById('pList');
  list.innerHTML='';
  ops.forEach(o=>{
    const a=document.createElement('a');
    a.className='card';a.href=o.url;a.target='_blank';a.rel='noopener';
    const lg=logoEl(o.company,true);
    const meta=document.createElement('div');meta.className='meta';
    meta.innerHTML=`<div class="nm">${OPERATORS[o.company]?.short||o.company}</div>
                    <div class="go">View ${region} cruises ↗</div>`;
    const ar=document.createElement('div');ar.className='arrow';ar.textContent='›';
    a.appendChild(lg);a.appendChild(meta);a.appendChild(ar);
    if(activeOp && o.company===activeOp) a.style.borderColor=getComputedStyle(document.documentElement).getPropertyValue('--accent2');
    list.appendChild(a);
  });
  panel.classList.add('open');
  const c=COORDS[region];
  map.flyTo([c[0],c[1]], Math.max(map.getZoom(),3.2), {duration:.8});
}
document.getElementById('close').addEventListener('click',()=>{panel.classList.remove('open');activeRegion=null;});
map.on('click',()=>{panel.classList.remove('open');});
document.addEventListener('keydown',e=>{if(e.key==='Escape')panel.classList.remove('open');});
});
</script>

<!-- ===== Menu show/hide toggle (mobile-friendly) ===== -->
<style>
  /* Frosted-glass pill controls that the menus collapse into */
  .menupill{position:absolute;z-index:1200;display:inline-flex;align-items:center;gap:9px;height:44px;
    padding:0 16px;border-radius:30px;cursor:pointer;font-family:var(--sans);font-size:12.5px;
    font-weight:700;letter-spacing:.3px;color:var(--ink);
    background:rgba(17,21,29,.5);border:1px solid rgba(236,223,194,.18);box-shadow:var(--shadow);
    -webkit-backdrop-filter:blur(16px) saturate(1.4);backdrop-filter:blur(16px) saturate(1.4);
    transition:background .16s,border-color .16s,transform .12s,opacity .2s}
  .menupill:hover{background:rgba(23,28,38,.82);border-color:var(--accent)}
  .menupill:active{transform:scale(.95)}
  .menupill .pi{font-size:16px;line-height:1;color:var(--accent);width:16px;text-align:center}
  #railPill{left:14px;bottom:84px}
  #panelPill{right:14px;bottom:84px;opacity:0;pointer-events:none}
  body.panel-active #panelPill{opacity:1;pointer-events:auto}
  /* Left rail fades to transparent + blurred, then collapses into its pill */
  .rail{transition:opacity .26s ease,transform .26s ease,visibility .26s}
  body.rail-hidden .rail{opacity:0;transform:translateX(-12px) scale(.97);visibility:hidden;pointer-events:none}
  /* Right detail panel collapses into its pill */
  body.panel-collapsed .panel.open{transform:translateX(105%)}
  @media (max-width:640px){
    .menupill .pl{display:none}
    .menupill{padding:0;width:44px;justify-content:center}
    body.rail-shown .rail{display:flex !important;opacity:1;visibility:visible;transform:none}
  }
</style>
<button id="railPill" class="menupill" type="button" aria-label="Show or hide the filters menu" title="Show / hide filters"><span class="pi">&#9776;</span><span class="pl">Filters</span></button>
<button id="panelPill" class="menupill" type="button" aria-label="Show or hide the details panel" title="Show / hide details"><span class="pi">&#8249;</span><span class="pl">Details</span></button>
<script>
(function(){
  var body=document.body;
  var railPill=document.getElementById('railPill');
  var panelPill=document.getElementById('panelPill');
  var panel=document.querySelector('.panel');
  var mq=window.matchMedia('(max-width:640px)');
  var railCollapsed=mq.matches;               // start collapsed on small screens
  function setIcon(el,ch){ var p=el&&el.querySelector('.pi'); if(p)p.innerHTML=ch; }
  function syncRail(){
    body.classList.toggle('rail-hidden',railCollapsed);
    body.classList.toggle('rail-shown',!railCollapsed);
    setIcon(railPill,railCollapsed?'&#9776;':'&#10005;');
  }
  function syncPanel(){
    setIcon(panelPill, body.classList.contains('panel-collapsed')?'&#8249;':'&#10005;');
  }
  railPill.addEventListener('click',function(){ railCollapsed=!railCollapsed; syncRail(); });
  panelPill.addEventListener('click',function(){ body.classList.toggle('panel-collapsed'); syncPanel(); });
  if(panel){
    new MutationObserver(function(){
      var open=panel.classList.contains('open');
      body.classList.toggle('panel-active',open);
      if(!open){ body.classList.remove('panel-collapsed'); }
      if(open && mq.matches){ railCollapsed=true; syncRail(); }
      syncPanel();
    }).observe(panel,{attributes:true,attributeFilter:['class']});
  }
  if(mq.addEventListener){ mq.addEventListener('change',function(e){ railCollapsed=e.matches; syncRail(); }); }
  syncRail(); syncPanel();
})();
</script>
</body>
</html>
